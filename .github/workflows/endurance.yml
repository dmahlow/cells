name: Endurance
on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: endurance
  cancel-in-progress: false
jobs:
  endurance:
    name: Endurance / ${{ matrix.scene }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scene: [mixed, blood, microbial]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Extended generated lifecycle and interaction sequences
        env:
          CELLS_EXTENDED_TESTS: '1'
        run: python -m unittest discover -s tests -p test_properties.py -v
      - name: One simulated hour with memory, population, and latency checks
        env:
          SCENE: ${{ matrix.scene }}
        run: python tools/endurance.py --steps 108000 --scene "$SCENE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: endurance-${{ matrix.scene }}
          path: endurance.json
          if-no-files-found: warn
