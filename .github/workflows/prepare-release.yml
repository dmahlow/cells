name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: New upstream version (for example 0.1.1)
        type: string
        required: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Generate a reviewable version and changelog patch
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          python tools/release.py prepare "$NEW_VERSION"
          git diff --check
          git diff --binary > release-preparation.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-preparation
          path: release-preparation.patch
          if-no-files-found: error
